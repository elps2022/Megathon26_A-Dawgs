version: 1
note: "Defaults for homes whose bills give no usable degree-day fit (otherwise Property.heating_share, from the fit, is used). Savings-simulator assumptions the energy model does not cover: heating vs base-load shares, heat pump hot water, solar (fabric retrofits use models/energy.py)."
gas_heating_share:
  value: 0.78
  source: "Space-heating share of domestic gas; 1 - 0.22 hot water/cooking, as config/synthetic.yaml consumption.gas_base_share (team share, consistent with NEED cooker-only gas homes using ~0.22 of a gas-heated home's gas, models/energy.py)"
electric_heating_share:
  value: 0.65
  source: "Team assumption: in an electrically heated home space heating is most of the electricity, the rest being SAP 10.2 Appendix L appliances and lighting. Used only when the model can't separate heating (labelled physics-based)"
heat_pump_hot_water_share_of_base_load:
  value: 0.5
  source: "Team assumption: non-heating gas is hot water (SAP 10.2 Appendix J) plus cooking (Appendix L); half is assumed to be hot water, which moves to the heat pump"
solar:
  default_kwp: 3.5
  yield_kwh_per_kwp: {Leeds: 850, Cornwall: 1000, Southwark: 950, default: 900}
  self_consumption: 0.155   # effective share of generation that cuts import; was 0.40, which doubled real savings
  self_consumption_source: >
    Calibrated on the 193 TRAIN-split NEED solar installs (data/need_labels.py): median difference-in-differences
    drop in metered import 487 kWh/yr = 3.5 kWp x 900 kWh/kWp x 0.155. It bundles real self-consumption with the
    smaller systems of 2010-2020 installs (NEED has no kWp). Checked on val / test installs: eval/eval_savings.py.
  max_share_of_import: 0.50
  source: "Regional yields 850-1000 kWh/kWp: EU JRC PVGIS for south-facing ~35 deg roofs (north lower, south-west higher); self-consumption calibrated on NEED PV installs (above); same values as config/synthetic.yaml solar block"
