version: 1
unit: "W/m2K"
source: "Values moved unchanged from engine/savings.py; RdSAP-style defaults. VERIFY against RdSAP 10 Tables S6-S10 (walls, roofs, windows, floors)."
roof:
  uninsulated: 2.3      # loft < 50 mm
  partial: 0.65         # loft 50-269 mm
  standard: 0.16        # loft >= 270 mm, or no own roof (heat loss to the flat above)
wall:
  solid_uninsulated: 2.1
  solid_insulated: 0.30
  cavity_uninsulated: 1.6
  cavity_insulated: 0.45
window:
  single: 4.8
  partial: 3.4
  double_old: 2.8
  double_new: 1.4
  triple: 0.8
floor:
  standard: 0.70
