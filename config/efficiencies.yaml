version: 1
unit: "ratio of useful heat delivered to fuel or electricity used (heat pump: SCOP)"

# fuel tells the energy model which meter the heating draws from.
heating_systems:
  gas_condensing:
    fuel: gas
    efficiency: 0.85
    source: "docs/ARCHITECTURE.md 3.5 (boiler ~0.85); VERIFY against SAP 10 Table 4a / 4b"
  gas_non_condensing:
    fuel: gas
    efficiency: 0.70
    source: "VERIFY: typical older non-condensing boiler seasonal efficiency (SAP 10 Table 4b)"
  oil:
    fuel: oil
    efficiency: 0.80
    source: "VERIFY: typical oil boiler seasonal efficiency (SAP 10 Table 4b)"
  lpg:
    fuel: lpg
    efficiency: 0.80
    source: "VERIFY: typical oil/LPG boiler seasonal efficiency (SAP 10 Table 4b)"
  heat_pump:
    fuel: electricity
    efficiency: 3.0
    efficiency_low: 2.8
    efficiency_high: 3.2
    source: "docs/ARCHITECTURE.md 3.5 (SCOP ~2.8-3.2); VERIFY against MCS / SAP 10 heat pump data"
  direct_electric:
    fuel: electricity
    efficiency: 1.0
    source: "docs/ARCHITECTURE.md 3.5 (direct electric 1.0)"
  storage_heaters:
    fuel: electricity
    efficiency: 1.0
    source: "VERIFY: electric resistance heating, all input becomes heat (SAP 10 Table 4a)"
  district:
    fuel: district_heat
    efficiency: 0.85
    source: "VERIFY: placeholder delivered efficiency for district heating (SAP 10)"
