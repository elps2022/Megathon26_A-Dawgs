version: 1
unit: "ratio of useful heat delivered to fuel or electricity used (heat pump: SCOP)"

# fuel tells the energy model which meter the heating draws from.
heating_systems:
  gas_condensing:
    fuel: gas
    efficiency: 0.85
    source: "SAP 10.2 Table 4b (BRE): condensing boiler with automatic ignition, 84% winter seasonal efficiency"
  gas_non_condensing:
    fuel: gas
    efficiency: 0.70
    source: "SAP 10.2 Table 4b: non-condensing 1998+ 74%, pre-1998 66-73%; 0.70 is the middle of that mix"
  oil:
    fuel: oil
    efficiency: 0.80
    source: "SAP 10.2 Table 4b: standard oil boiler 1998 or later 80%"
  lpg:
    fuel: lpg
    efficiency: 0.80
    source: "SAP 10.2 Table 4b (gas table covers LPG): condensing 84%, non-condensing 1998+ 74%; 0.80 is the mix"
  heat_pump:
    fuel: electricity
    efficiency: 3.0
    efficiency_low: 2.8
    efficiency_high: 3.2
    source: "Field data: Electrification of Heat demonstration (Energy Systems Catapult for DESNZ), median air source SPF 2.80 (interim report, 2023) and ~2.9 average (final, 2025, Heat Pump Association). Range 2.8-3.2 spans field results and newer installs; SAP 10.2 Table 4a default 1.70 is a worst-case unknown-product value, not used"
  direct_electric:
    fuel: electricity
    efficiency: 1.0
    source: "docs/ARCHITECTURE.md 3.5 (direct electric 1.0)"
  storage_heaters:
    fuel: electricity
    efficiency: 1.0
    source: "SAP 10.2 Table 4a: storage heaters 100% (code 401); all input becomes heat"
  district:
    fuel: district_heat
    efficiency: 0.80
    source: "SAP 10.2 Table 4a, heat networks with boilers (RdSAP code 301): 80%"
