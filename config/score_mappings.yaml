version: 1
source_note: >
  Weights and bands are fixed by the Lloyds PS2 problem statement. Mapping
  values are team drafts from docs/ARCHITECTURE.md section 3.3 unless a
  specific source is named.

weights:
  energy_efficiency: 0.25
  consumption_intensity: 0.20
  insulation: 0.15
  heating: 0.15
  glazing: 0.10
  renewables: 0.10
  smart_controls: 0.05

bands:            # checked top to bottom, first match wins
  - {name: "Highly efficient", min: 80}
  - {name: "Good", min: 65}
  - {name: "Moderate", min: 50}
  - {name: "Poor", min: 30}
  - {name: "Very poor", min: 0}

# Used when an input is missing. Never 0: missing data is flagged, not zeroed.
default_score: 40

energy_efficiency:
  rating_midpoints: {a: 96, b: 86, c: 75, d: 61, e: 46, f: 30, g: 10}
  source: "Midpoints of the EPC SAP-point bands (A 92-100, B 81-91, C 69-80, D 55-68, E 39-54, F 21-38, G 1-20; SAP 10.2 / gov.uk EPC guidance), rounded"

consumption_intensity:
  # Scored relative to similar homes, so neither big nor small homes are penalised for their size: energy doesn't
  # scale with floor area (hot water, cooking, appliances), so raw kWh/m2 scored small homes ~15 points worse
  # than large homes of similar efficiency on real NEED use (docs/SCORING.md). ratio = actual purchased energy /
  # expected purchased energy for a typical home of the same type, size, age band and EPC band (NEED model,
  # models/expected_use.py, median statistic) -> score, linear between, clipped.
  ratio_points: [[0.5, 100], [1.0, 75], [2.0, 0]]
  points: [[50, 100], [350, 0]]   # kWh/m2/yr, reported in inputs_used only
  source: "Team mapping: a typical home (ratio 1.0) keeps the old median sub-score (75 at NEED's median ~125 kWh/m2); half its expected use scores 100, double scores 0. Expected use: DESNZ NEED 2023 log-linear model (config/need_calibration.yaml)"

insulation:
  loft_weight: 0.5
  wall_weight: 0.5
  loft_mm_points: [[0, 0], [100, 50], [270, 100]]   # mm -> score, linear
  wall: {none: 0, partial: 50, full: 100}
  source: "Team mapping; 270 mm is the Energy Saving Trust recommended loft depth (RdSAP Table S9 roof U 0.16)"

heating:
  scores:
    heat_pump: 100
    district: 70
    gas_condensing: 55
    gas_non_condensing: 35
    storage_heaters: 30
    oil: 25
    lpg: 25
    direct_electric: 20
  source: "Team draft, ARCHITECTURE.md 3.3"

glazing:
  # Category names must match the Property schema vocabulary (src/greenhome/schema.py).
  scores:
    triple: 100
    double_new: 80        # double glazing installed 2002 or later
    double_old: 60        # double glazing installed before 2002, or date unknown
    partial: 35
    single: 0
  source: "Team draft, ARCHITECTURE.md 3.3"

renewables:
  solar_yield_kwh_per_kwp: 900     # ARCHITECTURE.md 3.6 quotes ~850-1000
  source: "EU JRC PVGIS: ~850-1000 kWh/kWp/yr for well-oriented roofs across the three areas; 900 is the middle (config/simulator.yaml has per-area values)"

smart_controls:
  scores:
    none: 0
    programmer: 30
    smart_thermostat: 70
    smart_trvs: 100
  source: "Team draft, ARCHITECTURE.md 3.3"
