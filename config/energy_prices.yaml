source: >
  Ofgem energy price cap, 1 October - 31 December 2026, average direct-debit unit rates for standard variable
  tariffs (England, Scotland, Wales): electricity 26.32p/kWh (VAT removed from electricity bills Oct 2026 - Mar
  2027), gas 7.97p/kWh including 5% VAT (ofgem.gov.uk, "Changes to energy price cap between 1 October and 31
  December 2026"). Standing charges are excluded: a retrofit does not change them.
