[project]
name = "greenhome"
version = "0.1.0"
description = "Green Home Score and Retrofit Recommendation Engine (Megathon X, Lloyds PS2)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "pydantic>=2.6",
    "pyyaml>=6",
    "odfpy>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/greenhome"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-p no:launch_ros -p no:launch_testing -p no:ament_flake8 -p no:ament_pep257 -p no:ament_lint -p no:ament_copyright -p no:ament_xmllint"
